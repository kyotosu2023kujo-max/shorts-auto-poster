name: Test Feedback Loop

on:
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  test-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: コードの取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: feedback_loop.py の単体実行
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python feedback_loop.py

      - name: 更新結果をリポジトリに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json system_prompt.txt
          git diff --staged --quiet || git commit -m "Test: Update metrics and system prompt [skip ci]"
          git pull --rebase origin main
          git push origin main
