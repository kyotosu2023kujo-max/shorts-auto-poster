name: Auto Generate Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  run-ai-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを読み込み
        uses: actions/checkout@v4

      - name: システムツールと日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg imagemagick

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts requests moviepy pillow google-api-python-client google-auth-oauthlib google-auth-httplib2 google-auth

      - name: AIスクリプトの実行と動画生成
        run: python build_video.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 完成した動画をダウンロード可能にする（成果物保存）
        uses: actions/upload-artifact@v4
        if: success() || always()
        with:
          name: shorts-video
          path: |
            output_shorts.mp4
            title.txt
          retention-days: 7

      - name: Googleドライブへ自動保存
        continue-on-error: true
        env:
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python upload_drive.py

      - name: YouTubeへ自動アップロード
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py
