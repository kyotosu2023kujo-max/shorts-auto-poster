name: Auto Generate Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  run-ai-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを読み込み
        uses: actions/checkout@v4

      - name: システムツールと日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg imagemagick

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts requests moviepy pillow google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: AIスクリプトの実行と動画生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python build_video.py

