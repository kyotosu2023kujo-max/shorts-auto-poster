name: Auto Generate Script

on:
  schedule:
    # 毎日 日本時間 19:00 (UTC 10:00) に自動実行
    - cron: '0 10 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-ai-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを読み込み
        uses: actions/checkout@v4

      - name: システムツールと日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic ffmpeg imagemagick

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts requests google-api-python-client google-auth-oauthlib google-auth-httplib2 google-auth

      - name: YouTube実績集計とプロンプト自動最適化（生成前実行）
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python feedback_loop.py

      - name: AIスクリプトの実行と動画生成
        run: python build_video.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: YouTubeへの自動投稿
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py

      - name: Googleドライブへのバックアップ保存
        continue-on-error: true
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python upload_drive.py

      - name: 成果物を保存（ダウンロード用）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-video
          path: |
            output_shorts.mp4
            title.txt
          retention-days: 3

      - name: 履歴ファイルと更新設定をリポジトリに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json system_prompt.txt video_style_config.json
          git diff --staged --quiet || git commit -m "Auto: Update metrics, prompt and video style [skip ci]"
          git pull --rebase origin main
          git push origin main
