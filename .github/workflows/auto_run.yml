name: Auto Generate Script

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  run-ai-script:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを読み込み
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai

      - name: AIスクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
