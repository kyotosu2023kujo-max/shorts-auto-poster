name: Note Draft Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  build-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate review article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_TRACKING_ID: ${{ secrets.AMAZON_TRACKING_ID }}
        run: |
          python scripts/generate_review.py

      - name: Upload draft to note
        env:
          NOTE_AUTH_JSON: ${{ secrets.NOTE_AUTH_JSON }}
        run: |
          python scripts/note_uploader.py

      # ↓ ここを追加：article_output.txt をダウンロード可能にする
      - name: Upload Article as Artifact
        if: always() # 前のステップが失敗してもtxtが生成されていれば保存
        uses: actions/upload-artifact@v4
        with:
          name: article_output
          path: article_output.txt
          retention-days: 7
