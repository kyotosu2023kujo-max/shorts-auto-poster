name: Note Draft Automation

on:
  workflow_dispatch: # GitHubの画面から手動テスト用
  schedule:
    - cron: '0 22 * * *' # 毎日JST午前7時（UTC 22:00）に実行

jobs:
  build-and-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate review article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_TRACKING_ID: ${{ secrets.AMAZON_TRACKING_ID }}
        run: |
          python scripts/generate_review.py
          
      - name: Upload draft to note
        env:
          NOTE_AUTH_JSON: ${{ secrets.NOTE_AUTH_JSON }}   # ← この行が必要です
        run: |
          python scripts/note_uploader.py
